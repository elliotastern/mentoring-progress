<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job search guide</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
        color: #1c1917;
        background: #fafaf9;
      }
      body {
        margin: 0;
        background:
          radial-gradient(1000px 420px at 8% -8%, #ccfbf1 0%, transparent 55%),
          #fafaf9;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 1.25rem 1.1rem 3rem;
      }
      .back {
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        color: #0f766e;
        text-decoration: none;
      }
      .back:hover { text-decoration: underline; }
      article { line-height: 1.55; }
      article h1 { font-size: 1.85rem; line-height: 1.2; }
      article h2 {
        margin-top: 2rem;
        padding-top: 0.4rem;
        border-top: 1px solid #e7e5e4;
        scroll-margin-top: 1rem;
      }
      article h3 { scroll-margin-top: 1rem; }
      article img {
        max-width: 100%;
        height: auto;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
        background: #fff;
      }
      article table {
        width: 100%;
        border-collapse: collapse;
        font-family: system-ui, sans-serif;
        font-size: 0.92rem;
      }
      article th, article td {
        border: 1px solid #e7e5e4;
        padding: 0.4rem 0.5rem;
        text-align: left;
        vertical-align: top;
      }
      article a { color: #0f766e; }
      .err {
        font-family: system-ui, sans-serif;
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
        padding: 0.8rem 1rem;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p><a class="back" id="back" href="../">← Progress checklist</a></p>
      <article id="content"><p class="err">Loading…</p></article>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const doc = params.get("doc") || "overview-v8.md";
      const base = location.pathname.replace(/view\.html$/, "");
      document.getElementById("back").href = base.replace(/\/docs\/?$/, "/") || "../";

      function slugify(text) {
        return String(text)
          .toLowerCase()
          .trim()
          .replace(/[^\w\s-]/g, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      const renderer = new marked.Renderer();
      renderer.heading = function ({ text, depth }) {
        const id = slugify(text.replace(/<[^>]+>/g, ""));
        return `<h${depth} id="${id}">${text}</h${depth}>`;
      };

      marked.setOptions({ renderer, gfm: true });

      fetch(doc)
        .then((r) => {
          if (!r.ok) throw new Error("Could not load " + doc);
          return r.text();
        })
        .then((md) => {
          document.getElementById("content").innerHTML = marked.parse(md);
          document.title = document.querySelector("article h1")?.textContent || doc;
          const hash = location.hash.slice(1);
          if (hash) {
            const el = document.getElementById(hash);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        })
        .catch((err) => {
          document.getElementById("content").innerHTML =
            `<p class="err">${err.message}</p>`;
        });
    </script>
  </body>
</html>
