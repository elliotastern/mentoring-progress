<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job search guide</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
        color: #1c1917;
        background: #fafaf9;
      }
      body {
        margin: 0;
        background:
          radial-gradient(1000px 420px at 8% -8%, #ccfbf1 0%, transparent 55%),
          #fafaf9;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 1.25rem 1.1rem 3rem;
      }
      .back {
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        color: #0f766e;
        text-decoration: none;
      }
      .back:hover { text-decoration: underline; }
      article { line-height: 1.55; }
      article h1 { font-size: 1.85rem; line-height: 1.2; }
      article h2 {
        margin-top: 2rem;
        padding-top: 0.4rem;
        border-top: 1px solid #e7e5e4;
        scroll-margin-top: 1rem;
      }
      article h3 { scroll-margin-top: 1rem; }
      article img {
        max-width: 100%;
        height: auto;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
        background: #fff;
      }
      article table {
        width: 100%;
        border-collapse: collapse;
        font-family: system-ui, sans-serif;
        font-size: 0.92rem;
      }
      article th, article td {
        border: 1px solid #e7e5e4;
        padding: 0.4rem 0.5rem;
        text-align: left;
        vertical-align: top;
      }
      article a { color: #0f766e; }
      .err {
        font-family: system-ui, sans-serif;
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
        padding: 0.8rem 1rem;
        border-radius: 8px;
      }
      .ai-clip {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 0;
        margin: 1.1rem 0 1.35rem;
        border: 1px solid #e7e5e4;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        font-family: system-ui, sans-serif;
      }
      .ai-clip-stage {
        position: relative;
        min-height: 160px;
        overflow: hidden;
        background: #f5f5f4;
      }
      .ai-clip-stage::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: linear-gradient(90deg, #0f766e, #14b8a6, #0f766e);
        background-size: 200% 100%;
        animation: ai-clip-bar 2.8s linear infinite;
      }
      .ai-clip-stage img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: 0;
        border-radius: 0;
        display: block;
        transform: scale(1.06);
        animation: ai-clip-pan 9s ease-in-out infinite alternate;
      }
      .ai-clip-body {
        padding: 0.95rem 1rem 1.05rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.35rem;
      }
      .ai-clip-kicker {
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #0f766e;
        font-weight: 650;
      }
      .ai-clip-body h3 {
        margin: 0;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 1.15rem;
        line-height: 1.25;
        color: #1c1917;
        border: 0;
        padding: 0;
      }
      .ai-clip-body p:not(.ai-clip-kicker) {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.45;
        color: #57534e;
      }
      .ai-clip-meta {
        margin-top: 0.35rem;
        font-size: 0.78rem;
        color: #78716c;
      }
      @media (max-width: 640px) {
        .ai-clip { grid-template-columns: 1fr; }
        .ai-clip-stage { min-height: 140px; }
      }
      @keyframes ai-clip-pan {
        from { transform: scale(1.06) translate(0, 0); }
        to { transform: scale(1.12) translate(-2.5%, -1.5%); }
      }
      @keyframes ai-clip-bar {
        from { background-position: 0% 0; }
        to { background-position: 200% 0; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p><a class="back" id="back" href="../">← Progress checklist</a></p>
      <article id="content"><p class="err">Loading…</p></article>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const doc = params.get("doc") || "overview-v8.md";
      const base = location.pathname.replace(/view\.html$/, "");
      document.getElementById("back").href = base.replace(/\/docs\/?$/, "/") || "../";

      function slugify(text) {
        return String(text || "")
          .toLowerCase()
          .trim()
          .replace(/[^\w\s-]/g, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      function heading_html(text, depth) {
        const plain = String(text || "").replace(/<[^>]+>/g, "");
        const id = slugify(plain);
        const level = Number(depth) || 1;
        return `<h${level} id="${id}">${text || ""}</h${level}>\n`;
      }

      const renderer = new marked.Renderer();
      // marked v12+ may call heading(token) or legacy heading(text, depth)
      renderer.heading = function (arg1, arg2) {
        if (arg1 && typeof arg1 === "object") {
          const text =
            arg1.text != null
              ? arg1.text
              : arg1.tokens && this.parser
                ? this.parser.parseInline(arg1.tokens)
                : "";
          return heading_html(text, arg1.depth);
        }
        return heading_html(arg1, arg2);
      };

      marked.setOptions({ renderer, gfm: true });

      fetch(doc)
        .then((r) => {
          if (!r.ok) throw new Error("Could not load " + doc);
          return r.text();
        })
        .then((md) => {
          document.getElementById("content").innerHTML = marked.parse(md);
          document.title = document.querySelector("article h1")?.textContent || doc;
          const hash = location.hash.slice(1);
          if (hash) {
            const el = document.getElementById(hash);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        })
        .catch((err) => {
          document.getElementById("content").innerHTML =
            `<p class="err">${err.message}</p>`;
        });
    </script>
  </body>
</html>
